let stage = 0, busy = false;
const card = document.getElementById('card');
const img  = document.getElementById('img');
const s1   = document.getElementById('snd1');
const s2   = document.getElementById('snd2');

function tap(e) {
  if (busy) return;
  busy = true;

  // Important for iPhone: trigger audio inside the gesture
  if (stage === 0) { try { s1.currentTime = 0; s1.play(); } catch(ex) {} }
  else if (stage === 1) { try { s2.currentTime = 0; s2.play(); } catch(ex) {} }

  card.classList.add('shake');
  setTimeout(()=> {
    card.classList.remove('shake');
    stage = (stage + 1) % 3;
    img.src = images[stage];
    setTimeout(()=> busy = false, 120);
  }, 400);

  if (e.type === 'touchstart') e.preventDefault();
}

card.addEventListener('touchstart', tap, {passive:false});
card.addEventListener('click', tap);
</script>
